{
  "name": "uxui-healthcare",
  "services": {
    "mongo": {
      "image": "mongo:8.0",
      "command": [
        "mongod",
        "--replSet",
        "rs0",
        "--bind_ip_all"
      ],
      "ports": [
        "127.0.0.1:27018:27017"
      ],
      "volumes": [
        {
          "type": "bind",
          "source": "../.local/mongo-data",
          "target": "/data/db"
        }
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { if (db.hello().isWritablePrimary) { quit(0); } try { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"localhost:27017\"}]}); } catch(e) {} quit(1); } catch(e) { quit(1); }"
        ],
        "interval": "5s",
        "timeout": "10s",
        "retries": 20
      }
    },
    "mailpit": {
      "image": "axllent/mailpit:v1.27",
      "ports": [
        "127.0.0.1:1025:1025",
        "127.0.0.1:8025:8025"
      ]
    }
  }
}
